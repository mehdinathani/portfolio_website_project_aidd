            format: date
          - type: 'null'
          title: Date Earned
        credential_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Url
        order_index:
          type: integer
          title: Order Index
          default: 0
      type: object
      required:
      - name
      title: CertificationCreate
    CertificationResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
