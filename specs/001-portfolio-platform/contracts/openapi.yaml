          - type: 'null'
          title: Issuer
        date_earned:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date Earned
        credential_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Url
        order_index:
          type: integer
          title: Order Index
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - name
      - created_at
      title: CertificationResponse
    CertificationUpdate:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        issuer:
          anyOf:
          - type: string
          - type: 'null'
          title: Issuer
        date_earned:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date Earned
        credential_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Url
        order_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Order Index
      type: object
      title: CertificationUpdate
    ChatMessage:
      properties:
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
      type: object
      required:
      - role
      - content
      title: ChatMessage
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        history:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChatMessage'
            type: array
          - type: 'null'
          title: History
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
